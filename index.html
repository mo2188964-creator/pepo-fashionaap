<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيبو فاشن | Pepo Fashion</title>
    <!-- ربط مكتبة التصميم السريع ومكتبة الأيقونات الرسمية لتعمل مباشرة على الهاتف -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- الهيدر العلوي وثابت أعلى الشاشة عند التصفح -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-gray-100">
        <div class="flex items-center gap-2">
            <span class="text-purple-600 text-xl font-black">🛍️ bipo</span>
            <h1 class="text-lg font-bold text-gray-800">بيبو فاشن</h1>
        </div>
        <!-- أيقونة سلة المشتريات الحقيقية مع العداد -->
        <div class="relative bg-purple-50 p-2 rounded-full text-purple-600 cursor-pointer" onclick="toggleCart()">
            <svg xmlns="http://w3.org" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
        </div>
    </header>

    <!-- لافتة الترحيب الكبرى للمتجر -->
    <section class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-center py-8 px-4 shadow-inner">
        <h2 class="text-2xl font-black mb-2">أحدث صيحات الموضة والأزياء الملكية</h2>
        <p class="text-purple-100 text-xs">اكتشفي تشكيلتنا الحصرية المصممة خصيصاً لأجلكِ</p>
    </section>

    <!-- أزرار الفلاتر والأقسام الحقيقية لتصنيف الملابس -->
    <div class="p-4 overflow-x-auto flex gap-2 whitespace-nowrap bg-white border-b border-gray-100 sticky top-[57px] z-40">
        <button onclick="filterCategory('الكل')" class="cat-btn px-5 py-2 rounded-full text-sm font-bold bg-purple-600 text-white shadow-md transition-all">الكل</button>
        <button onclick="filterCategory('فساتين')" class="cat-btn px-5 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-600 transition-all">فساتين سهرة</button>
        <button onclick="filterCategory('عبايات')" class="cat-btn px-5 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-600 transition-all">عبايات ملكية</button>
        <button onclick="filterCategory('كاجوال')" class="cat-btn px-5 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-600 transition-all">أزياء كاجوال</button>
    </div>

    <!-- شبكة المنتجات الحقيقية بالأسعار والصور التوضيحية العالية الجودة -->
    <main class="p-4 grid grid-cols-2 gap-4 flex-1" id="products-grid">
        <!-- المنتج 1 -->
        <div class="product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between" data-category="فساتين">
            <img src="https://unsplash.com" class="w-full h-44 object-cover" alt="فستان">
            <div class="p-3">
                <span class="text-[10px] text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded">فساتين سهرة</span>
                <h3 class="text-sm font-bold text-gray-800 mt-1">فستان سهرة مطرز أنيق</h3>
                <p class="text-purple-600 font-black text-sm mt-1">450 ج.م</p>
                <button onclick="addToCart('فستان سهرة مطرز')" class="w-full bg-purple-600 text-white text-xs font-bold py-2 rounded-xl mt-3 active:scale-95 transition-transform">إضافة للسلة</button>
            </div>
        </div>
        <!-- المنتج 2 -->
        <div class="product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between" data-category="عبايات">
            <img src="https://unsplash.com" class="w-full h-44 object-cover" alt="عباية">
            <div class="p-3">
                <span class="text-[10px] text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded">عبايات ملكية</span>
                <h3 class="text-sm font-bold text-gray-800 mt-1">عباءة سوداء خليجي فاخرة</h3>
                <p class="text-purple-600 font-black text-sm mt-1">600 ج.م</p>
                <button onclick="addToCart('عباءة سوداء خليجي')" class="w-full bg-purple-600 text-white text-xs font-bold py-2 rounded-xl mt-3 active:scale-95 transition-transform">إضافة للسلة</button>
            </div>
        </div>
    </main>

    <!-- فوتر للتواصل الحقيقي عبر الهاتف والموقع -->
    <footer class="bg-white border-t border-gray-100 p-4 text-center text-xs text-gray-500 flex flex-col gap-1 items-center mt-6">
        <p class="font-bold text-gray-700">📍 موقعنا: القاهرة، مصر</p>
        <p>© 2026 جميع الحقوق محفوظة لمتجر بيبو فاشن</p>
    </footer>

    <!-- نظام البرمجة الذكي لإدارة السلة والفلاتر بدون أخطاء -->
    <script>
        let count = 0;
        function addToCart(itemName) {
            count++;
            const badge = document.getElementById('cart-count');
            badge.innerText = count;
            badge.classList.remove('hidden');
            alert('🛍️ تم إضافة ' + itemName + ' إلى سلة مشترياتك بنجاح!');
        }

        function filterCategory(category) {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                if (category === 'الكل' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
            
            // تغيير شكل الزر النشط
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                if(btn.innerText.includes(category) || (category === 'الكل' && btn.innerText === 'الكل')) {
                    btn.className = "cat-btn px-5 py-2 rounded-full text-sm font-bold bg-purple-600 text-white shadow-md transition-all";
                } else {
                    btn.className = "cat-btn px-5 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-600 transition-all";
                }
            });
        }
    </script>
</body>
</html>
